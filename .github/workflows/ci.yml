name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene-and-dag:
    name: Hygiene & DAG (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "hygiene"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check headless non-UI crates in isolation (before installing GUI libs)
        run: |
          cargo test --locked -p veldmap-core --no-default-features
          cargo test --locked -p veldmap-raster
          cargo test --locked -p veldmap-storage
          cargo test --locked -p veldmap-net

      - name: Install Linux GUI/windowing dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: Run Clippy (production targets without test-support, then all targets)
        run: |
          cargo clippy --locked --workspace --lib --bins -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check rustdoc builds cleanly
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

      - name: Install and run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check English-only hygiene (no Cyrillic)
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, sys

          pattern = re.compile(r"[\u0400-\u04FF]")
          skip_dirs = {".git", "target"}
          offenders = []

          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = sorted(d for d in dirnames if d not in skip_dirs)
              for filename in sorted(filenames):
                  path = pathlib.Path(dirpath, filename)
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          offenders.append(f"{path}:{lineno}: {line.strip()}")

          if offenders:
              print("Cyrillic characters found:", file=sys.stderr)
              for item in offenders[:50]:
                  print(f"  {item}", file=sys.stderr)
              sys.exit(1)
          print("English-only hygiene check passed.")
          EOF

      - name: Check workspace DAG and presentation-only ui/ isolation
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys, tomllib

          errors = []

          def collect_deps(manifest, sections):
              deps = set()
              for sec in sections:
                  deps.update(manifest.get(sec, {}).keys())
              for tgt in manifest.get("target", {}).values():
                  if isinstance(tgt, dict):
                      for sec in sections:
                          deps.update(tgt.get(sec, {}).keys())
              return deps

          # 1. Strict 3-tier workspace DAG + dependency purity checks.
          manifests = {
              p.parent.name: tomllib.loads(p.read_text(encoding="utf-8"))
              for p in sorted(pathlib.Path("crates").glob("*/Cargo.toml"))
          }
          core_forbidden = {
              "tokio", "reqwest", "rusqlite", "image", "tiff",
              "egui", "eframe", "wgpu", "rfd", "directories",
          }
          app_forbidden_direct = {"serde_json", "reqwest", "tokio", "rusqlite", "tiff"}
          middle_crates = {"veldmap-raster", "veldmap-storage", "veldmap-net"}

          for crate_name, data in manifests.items():
              prod_deps = collect_deps(data, ("dependencies", "build-dependencies"))
              dev_deps = collect_deps(data, ("dev-dependencies",))
              ws_prod = {d for d in prod_deps if d.startswith("veldmap-")}
              ws_dev = {d for d in dev_deps if d.startswith("veldmap-")}

              if crate_name == "veldmap-core":
                  if ws_prod:
                      errors.append(f"veldmap-core must have no workspace deps, found: {sorted(ws_prod)}")
                  bad_dev = ws_dev - {"veldmap-core"}
                  if bad_dev:
                      errors.append(f"veldmap-core dev-deps may not depend on: {sorted(bad_dev)}")
                  bad_ext = (prod_deps | dev_deps) & core_forbidden
                  if bad_ext:
                      errors.append(f"veldmap-core imports forbidden crate(s): {sorted(bad_ext)}")
              elif crate_name in middle_crates:
                  bad_prod = ws_prod - {"veldmap-core"}
                  if bad_prod:
                      errors.append(f"{crate_name} violates zero-horizontal-deps rule: {sorted(bad_prod)}")
                  bad_dev = ws_dev - {"veldmap-core", crate_name}
                  if bad_dev:
                      errors.append(f"{crate_name} dev-deps violate zero-horizontal-deps rule: {sorted(bad_dev)}")
              elif crate_name == "veldmap-app":
                  bad_direct = prod_deps & app_forbidden_direct
                  if bad_direct:
                      errors.append(f"veldmap-app must not directly depend on: {sorted(bad_direct)}")

          # 2. Presentation-only ui/ isolation check (strip comments first).
          comment_re = re.compile(r"//[^\n]*|/\*.*?\*/", re.DOTALL)
          ui_forbidden = re.compile(
              r"\b(veldmap_net|veldmap_raster|veldmap_storage|wgpu|egui_wgpu|rfd|"
              r"reqwest|tokio|rusqlite|serde_json|OverlayManager|VectorManager|"
              r"BasemapManager|StacSession|MeasureSession|SceneState|GlobeRenderer)\b|"
              r"\bcrate::(render|scene|gpu_tiles|app)\b"
          )
          for rs_path in sorted(pathlib.Path("crates/veldmap-app/src/ui").rglob("*.rs")):
              stripped = comment_re.sub("", rs_path.read_text(encoding="utf-8"))
              for match in ui_forbidden.finditer(stripped):
                  errors.append(f"{rs_path}: forbidden ui/ reference `{match.group(0)}`")

          if errors:
              print("Architecture boundary check failed:", file=sys.stderr)
              for err in errors:
                  print(f"  - {err}", file=sys.stderr)
              sys.exit(1)
          print("Workspace DAG and ui/ isolation checks passed.")
          EOF

      - name: Check offline markdown links in docs/ and root markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress docs/ assets/README.md README.md plan.md CONTRIBUTING.md SECURITY.md THIRD_PARTY_NOTICES.md
          fail: true

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require_gpu: "1"
          - os: windows-latest
            require_gpu: "1"
          - os: macos-latest
            require_gpu: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/windowing libs and Lavapipe software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "test"

      - name: Run Clippy (Windows/macOS; Linux covered in hygiene-and-dag)
        if: runner.os != 'Linux'
        run: |
          cargo clippy --locked --workspace --lib --bins -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace unit, shader codegen, and headless GPU smoke tests
        env:
          VELDMAP_REQUIRE_GPU_TEST: ${{ matrix.require_gpu }}
        run: cargo test --locked --workspace
