name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene-and-dag:
    name: Hygiene & DAG (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "hygiene"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check headless non-UI crates in isolation (before installing GUI libs)
        run: |
          cargo test --locked -p veldmap-core --no-default-features
          cargo test --locked -p veldmap-raster
          cargo test --locked -p veldmap-storage
          cargo test --locked -p veldmap-net

      - name: Install Linux GUI/windowing dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check rustdoc builds cleanly
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps

      - name: Install and run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check English-only hygiene (no Cyrillic outside old/)
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, sys

          pattern = re.compile(r"[\u0400-\u04FF]")
          skip_dirs = {".git", "target", "old"}
          offenders = []

          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = sorted(d for d in dirnames if d not in skip_dirs)
              for filename in sorted(filenames):
                  path = pathlib.Path(dirpath, filename)
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          offenders.append(f"{path}:{lineno}: {line.strip()}")

          if offenders:
              print("Cyrillic characters found outside old/:", file=sys.stderr)
              for item in offenders[:50]:
                  print(f"  {item}", file=sys.stderr)
              sys.exit(1)
          print("English-only hygiene check passed.")
          EOF

      - name: Forbid links from docs/ into old/
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          inline_pattern = re.compile(r"\]\((?:[^)]*/)?old(?:/|\))")
          ref_pattern = re.compile(r"^\s*\[[^\]]+\]:\s*(?:\S*/)?old(?:/|$)")
          offenders = []
          for path in sorted(pathlib.Path("docs").rglob("*.md")):
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if inline_pattern.search(line) or ref_pattern.search(line):
                      offenders.append(f"{path}:{lineno}: {line.strip()}")

          if offenders:
              print("Forbidden links from docs/ into old/:", file=sys.stderr)
              for item in offenders:
                  print(f"  {item}", file=sys.stderr)
              sys.exit(1)
          print("No docs/ -> old/ links found.")
          EOF

      - name: Check offline markdown links in docs/ and root markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress docs/ assets/README.md README.md plan.md CONTRIBUTING.md SECURITY.md THIRD_PARTY_NOTICES.md
          fail: true

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require_gpu: "1"
          - os: windows-latest
            require_gpu: "1"
          - os: macos-latest
            require_gpu: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/windowing libs and Lavapipe software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "test"

      - name: Run Clippy (Windows/macOS; Linux covered in hygiene-and-dag)
        if: runner.os != 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace unit, shader codegen, and headless GPU smoke tests
        env:
          VELDMAP_REQUIRE_GPU_TEST: ${{ matrix.require_gpu }}
        run: cargo test --locked --workspace
