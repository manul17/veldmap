name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene-and-dag:
    name: Hygiene & DAG (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/windowing dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check veldmap-core isolated leaf build
        run: |
          cargo check -p veldmap-core --no-default-features
          cargo test -p veldmap-core --no-default-features

      - name: Run naga WGSL SPV/HLSL/MSL shader codegen test
        run: cargo test -p veldmap-app --test shader_codegen

      - name: Install and run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check English-only hygiene (no Cyrillic outside old/)
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          root = pathlib.Path(".")
          pattern = re.compile(r"[\u0400-\u04FF]")
          skip_dirs = {".git", "target", "old"}
          offenders = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      offenders.append(f"{path}:{lineno}: {line.strip()}")

          if offenders:
              print("Cyrillic characters found outside old/:", file=sys.stderr)
              for item in offenders[:50]:
                  print(f"  {item}", file=sys.stderr)
              sys.exit(1)
          print("English-only hygiene check passed.")
          EOF

      - name: Forbid links from docs/ into old/
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          pattern = re.compile(r"\]\([^)]*(?:^|/)old(?:/|\))")
          offenders = []
          for path in sorted(pathlib.Path("docs").rglob("*.md")):
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if pattern.search(line):
                      offenders.append(f"{path}:{lineno}: {line.strip()}")

          if offenders:
              print("Forbidden links from docs/ into old/:", file=sys.stderr)
              for item in offenders:
                  print(f"  {item}", file=sys.stderr)
              sys.exit(1)
          print("No docs/ -> old/ links found.")
          EOF

      - name: Check offline markdown links in docs/ and root markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress docs/ README.md plan.md CONTRIBUTING.md SECURITY.md THIRD_PARTY_NOTICES.md
          fail: true

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require_gpu: "1"
          - os: windows-latest
            require_gpu: "1"
          - os: macos-latest
            require_gpu: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/windowing libs and Lavapipe software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace unit, shader codegen, and headless GPU smoke tests
        env:
          VELDMAP_REQUIRE_GPU_TEST: ${{ matrix.require_gpu }}
        run: cargo test --workspace -- --nocapture
