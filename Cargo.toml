[workspace]
members = [
    "crates/veldmap-core",
    "crates/veldmap-raster",
    "crates/veldmap-storage",
    "crates/veldmap-net",
    "crates/veldmap-app",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
blake3 = "1.8.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
crs-definitions = { version = "0.6.0", default-features = false, features = ["proj4"] }
dejavu = "2.37.0"
directories = "6.0.0"
earcut = "0.4.12"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
geographiclib-rs = "0.2.7"
glam = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
image-webp = "0.2.4"
jpeg-decoder = { version = "0.3.2", default-features = false }
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
naga = { version = "30.0.2", features = ["wgsl-in", "spv-out", "hlsl-out", "msl-out"] }
png = "0.18.1"
pollster = "1.0.3"
proj4rs = "0.3.1"
proj4wkt = "0.2.0"
qoi = "0.4.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tiff = { version = "0.11.3", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
weezl = "0.1.12"
wgpu = "30.0.2"
zstd = "0.13.5"

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
large_futures = "warn"
