# Configuration for `cargo-deny` (licenses, advisories, bans, sources).

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[[licenses.exceptions]]
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
crate = "epaint_default_fonts"

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
deny = [
    # Safety, TLS packaging, and anti-legacy-regression bans (see docs/decisions.md).
    # Wayland windowing (`smithay-client-toolkit` / `winit`) uses memmap2 for SHM buffers;
    # direct or core usage remains banned.
    { crate = "memmap2", wrappers = ["smithay-client-toolkit", "winit"], reason = "Use safe positioned I/O instead of memory-mapped files" },
    { crate = "openssl", reason = "Use pure-Rust rustls instead of OpenSSL C dependencies" },
    { crate = "openssl-sys", reason = "Use pure-Rust rustls instead of OpenSSL C dependencies" },
    { crate = "wasmtime", reason = "VeldMap is purely native Rust; no WASI/Wasmtime host" },
    { crate = "sqlx", reason = "Avoid heavy async SQL ORM dependencies" },
    { crate = "prost", reason = "No protobuf/ConnectRPC in VeldMap" },
    { crate = "tonic", reason = "No gRPC/ConnectRPC in VeldMap" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
