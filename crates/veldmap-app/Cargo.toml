[package]
name = "veldmap-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[lib]
name = "veldmap_app"
path = "src/lib.rs"

[[bin]]
name = "veldmap"
path = "src/main.rs"
test = false

[dependencies]
bytemuck.workspace = true
dejavu.workspace = true
eframe.workspace = true
pollster.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
veldmap-core = { path = "../veldmap-core" }
veldmap-net = { path = "../veldmap-net" }
veldmap-raster = { path = "../veldmap-raster" }
veldmap-storage = { path = "../veldmap-storage" }
wgpu.workspace = true

[dev-dependencies]
naga.workspace = true
veldmap-app = { path = ".", features = ["test-support"] }
veldmap-core = { path = "../veldmap-core", features = ["test-support"] }
veldmap-net = { path = "../veldmap-net", features = ["test-support"] }
veldmap-raster = { path = "../veldmap-raster", features = ["test-support"] }
veldmap-storage = { path = "../veldmap-storage", features = ["test-support"] }

[lints]
workspace = true
